env:
  id: Reacher-v5
  seed: 0
  render_size: 96
  success_return_threshold: null
collect:
  transitions: 30000
lewm:
  latent_dim: 256
  hidden_dim: 512
  sigreg_lambda: 0.1
  sigreg_projections: 512
  sigreg_knots: 17
  batch_size: 256
  epochs: 40
  lr: 0.0003
reward_probe:
  epochs: 20
  lr: 0.001
mpc:
  horizon: 20
  candidates: 2048
  elites: 128
  iterations: 5
  init_std: 0.65
  min_std: 0.04
  discount: 0.99
rl_residual:
  total_steps: 50000
  random_steps: 3000
  start_steps: 3000
  ramp_steps: 10000
  residual_scale: 0.12
  replay_capacity: 100000
  batch_size: 512
  hidden_dim: 512
  lr: 0.0003
  gamma: 0.99
  tau: 0.005
  init_alpha: 0.1
  target_entropy_scale: 0.7
  consistency_coef: 0.05
  updates_per_step: 1
eval:
  episodes: 10
logging:
  root: runs
hardware:
  profile: RTX 5090 32GB
  precision: bf16
  allow_tf32: true
  cudnn_benchmark: true
  matmul_precision: high
