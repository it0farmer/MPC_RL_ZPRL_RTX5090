env:
  id: HalfCheetah-v5
  seed: 0
  success_return_threshold: null
train:
  total_steps: 100000
  warmup_steps: 5000
  wm_update_interval: 500
  wm_updates: 40
  batch_size: 1024
  rl_start_steps: 6000
  rl_updates_per_step: 1
  eval_interval: 5000
  final_eval_episodes: 5
  checkpoint_interval: 10000
world_model:
  ensemble_size: 7
  hidden_dim: 512
  lr: 0.001
  weight_decay: 1.0e-05
  uncertainty_penalty: 0.2
mpc:
  horizon: 20
  candidates: 4096
  elites: 256
  iterations: 5
  alpha: 0.2
  init_std: 0.6
  min_std: 0.05
  discount: 0.99
residual:
  chunk_len: 3
  residual_scale: 0.10
  adaptive_gate: true
  gate_mode: running_zscore
  gate_momentum: 0.995
  gate_initial_std: 0.05
  # Full 5-seed evaluation showed good runs around gate=0.40-0.47 while
  # failed seeds collapsed to gate=0.09-0.19. Keep a moderate trust region
  # instead of allowing the residual authority to collapse across seeds.
  gate_z_threshold: 0.0
  gate_z_temperature: 1.0
  gate_min: 0.28
  gate_max: 0.60
  gate_power: 1.0
  ramp_steps: 5000
  fixed_gate: 1.0
  consistency_coef: 0.04
  temporal_decay: 0.8
sac:
  hidden_dim: 512
  lr: 0.0003
  gamma: 0.99
  tau: 0.005
  init_alpha: 0.2
  target_entropy_scale: 1.0
logging:
  root: runs
hardware:
  profile: RTX 5090 32GB
  precision: bf16
  allow_tf32: true
  cudnn_benchmark: true
  matmul_precision: high
zprl_style:
  bc_collect_steps: 20000
  bc_epochs: 140
  latent_dim: 32
  base_hidden_dim: 768
  base_eval_episodes: 5
  base_eval_warn_threshold: 0.0
  residual_start_steps: 5000
  residual_ramp_steps: 20000
  residual_scale: 0.04
  consistency_coef: 0.03
  dagger_rounds: 4
  dagger_steps_per_round: 2500
  dagger_refit_epochs: 50
