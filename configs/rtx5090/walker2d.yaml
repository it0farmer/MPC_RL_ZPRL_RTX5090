env:
  id: Walker2d-v5
  seed: 0
  success_return_threshold: null
train:
  total_steps: 100000
  warmup_steps: 5000
  wm_update_interval: 500
  wm_updates: 40
  batch_size: 1024
  rl_start_steps: 6000
  rl_updates_per_step: 1
  eval_interval: 5000
  final_eval_episodes: 3
  checkpoint_interval: 10000
world_model:
  ensemble_size: 7
  hidden_dim: 512
  lr: 0.001
  weight_decay: 1.0e-05
  uncertainty_penalty: 0.2
mpc:
  horizon: 15
  candidates: 2048
  elites: 128
  iterations: 5
  alpha: 0.2
  init_std: 0.6
  min_std: 0.05
  discount: 0.99
residual:
  chunk_len: 3
  residual_scale: 0.06
  adaptive_gate: true
  gate_mode: running_zscore
  gate_momentum: 0.995
  gate_initial_std: 0.05
  gate_z_threshold: 1.0
  gate_z_temperature: 0.75
  gate_min: 0.0
  gate_max: 0.65
  gate_power: 1.5
  ramp_steps: 5000
  fixed_gate: 1.0
  consistency_coef: 0.1
  temporal_decay: 0.7
sac:
  hidden_dim: 512
  lr: 0.0003
  gamma: 0.99
  tau: 0.005
  init_alpha: 0.2
  target_entropy_scale: 1.0
logging:
  root: runs
hardware:
  profile: RTX 5090 32GB
  precision: bf16
  allow_tf32: true
  cudnn_benchmark: true
  matmul_precision: high
zprl_style:
  bc_collect_steps: 6000
  bc_epochs: 80
  latent_dim: 16
  residual_ramp_steps: 5000
  residual_scale: 0.04
